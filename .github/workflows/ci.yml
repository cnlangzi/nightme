name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build + Vet + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-linux-amd64
          path: coverage.out

  # Windows-hosted test runner. Runs the same `go test` command
  # as the linux job, but on a real windows-latest hosted runner
  # so windows-tagged tests (`//go:build windows`) actually run
  # and unix-tagged tests (`//go:build !windows`) are skipped
  # by the Go build system instead of failing to compile.
  #
  # Required because some tests use platform-only syscalls
  # (e.g. AF_UNIX sockets in daemoncontrol, Setpgid in
  # claudecode agent_interrupt_unix_test.go) that intentionally
  # don't compile on Windows. Without a Windows-hosted runner,
  # those tags just mean "never tested" — a Windows-only
  # regression would slip past CI. The cross-compile job
  # below (still compile-only) catches build breaks; this job
  # catches runtime regressions.
  #
  # Fail-fast gate: `test` runs first as the cheap linux/amd64
  # signal — any regression there short-circuits the windows
  # runner entirely instead of burning a paid hosted runner on
  # a known-broken tree.
  test-windows:
    name: Build + Vet + Test (windows/amd64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        run: go build ./...

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        # -count=1 disables the Go test cache so a flaky test that
        # "passed yesterday" can't hide a real regression. We do
        # NOT pass -race here because race costs 2-3x runtime
        # and the coverage gate is on the linux job above; race
        # detection is exercised on linux where the gate matters
        # most.
        shell: bash
        run: go test -count=1 ./...

  # Cross-compile check. Runs on ubuntu-latest (cheapest runner)
  # and cross-compiles to Windows + macOS to catch OS-conditional
  # build breaks without paying for a Windows/macOS hosted
  # runner on every PR.
  #
  # Why no tests: the test suite contains platform-specific files
  # tagged with `//go:build !windows` (e.g. daemoncontrol tests for
  # AF_UNIX sockets, Setpgid in claudecode agent_interrupt_unix_test.go)
  # that intentionally don't compile on Windows. The actual Windows
  # test run happens in the test-windows job above — a real
  # windows-latest hosted runner that picks up the windows-tagged
  # tests (`//go:build windows`) and skips the unix-tagged ones
  # via the Go build system.
  #
  # Fail-fast gate: `test` runs first as the cheap linux/amd64
  # signal — any regression there short-circuits the cross-compile
  # runners entirely instead of burning 4 runner minutes in
  # parallel with a failing test. The cross-compile matrix itself
  # still runs in parallel after the gate (peak 4); `fail-fast:
  # false` keeps all four targets reporting even when one breaks.
  cross-compile:
    name: Cross-compile (${{ matrix.target.GOOS }}/${{ matrix.target.GOARCH }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - GOOS: windows
            GOARCH: amd64
            binary: nightme.exe
          - GOOS: windows
            GOARCH: arm64
            binary: nightme.exe
          - GOOS: darwin
            GOARCH: amd64
            binary: nightme
          - GOOS: darwin
            GOARCH: arm64
            binary: nightme
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (${{ matrix.target.GOOS }}/${{ matrix.target.GOARCH }})
        env:
          GOOS: ${{ matrix.target.GOOS }}
          GOARCH: ${{ matrix.target.GOARCH }}
          CGO_ENABLED: "0"
        run: go build -o dist/${{ matrix.target.GOOS }}-${{ matrix.target.GOARCH }}/${{ matrix.target.binary }} ./cmd/nightme

      - name: Vet (${{ matrix.target.GOOS }}/${{ matrix.target.GOARCH }})
        env:
          GOOS: ${{ matrix.target.GOOS }}
          GOARCH: ${{ matrix.target.GOARCH }}
        run: go vet ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: nightme-${{ matrix.target.GOOS }}-${{ matrix.target.GOARCH }}
          path: dist/${{ matrix.target.GOOS }}-${{ matrix.target.GOARCH }}/${{ matrix.target.binary }}
          if-no-files-found: error
