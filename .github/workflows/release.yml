      # Locate the platform-specific sherpa-onnx-go sub-module so
      # we can copy the matching .so/.dylib/.dll into the
      # archive. The module path is stable across releases
      # because Go module caching keeps the same dir name.
      - name: Locate sherpa-onnx-go libs
        id: loc
        shell: bash
        run: |
          set -euo pipefail
          # The cgo build expects SRCDIR/lib/<triple>/<libs>.
          # Module path is the same on every runner; we just
          # need to resolve $GOMODCACHE to the actual root.
          GOMOD=$(go env GOMODCACHE)
          TRIPLE="${{ matrix.lib_subdir }}"
          LIB_DIR="${GOMOD}/github.com/k2-fsa/sherpa-onnx-go-${GOOS/ windows/windows}@$(go list -m -f '{{.Version}}' github.com/k2-fsa/sherpa-onnx-go-${GOOS/ windows/windows})/lib/${TRIPLE}"
          # macOS Go uses "darwin" as GOOS; the per-arch
          # triple is "aarch64-apple-darwin".
          if [ "${GOOS}" = "darwin" ]; then
            LIB_DIR="${GOMOD}/github.com/k2-fsa/sherpa-onnx-go-macos@$(go list -m -f '{{.Version}}' github.com/k2-fsa/sherpa-onnx-go-macos)/lib/aarch64-apple-darwin"
          fi
          if [ "${GOOS}" = "windows" ]; then
            LIB_DIR="${GOMOD}/github.com/k2-fsa/sherpa-onnx-go-windows@$(go list -m -f '{{.Version}}' github.com/k2-fsa/sherpa-onnx-go-windows)/lib/${TRIPLE}"
          fi
          if [ ! -d "${LIB_DIR}" ]; then
            echo "::error::sherpa-onnx-go libs not found at ${LIB_DIR}"
            exit 1
          fi
          echo "lib_dir=${LIB_DIR}" >> "$GITHUB_OUTPUT"

      # Build with cgo_sherpa + rpath baked to $ORIGIN/lib.
      # The platform libs (sherpa-onnx-c-api, onnxruntime) are
      # copied into STAGE/lib/ so the relative rpath resolves
      # at run time without requiring system packages.
      - name: Build nightme-stt
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -Wl,-rpath,$ORIGIN/lib
          LDFLAGS: -X github.com/cnlangzi/nightme/internal/version.Version=${{ steps.meta.outputs.version }}                     -X github.com/cnlangzi/nightme/internal/version.GitCommit=${{ steps.meta.outputs.commit }}                     -X github.com/cnlangzi/nightme/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        shell: bash
        run: |
          set -euo pipefail
          go build -tags cgo_sherpa -ldflags "$LDFLAGS"             -o "bin/${{ matrix.binary }}" ./cmd/nightme-stt
          # Confirm the C binding actually got linked.
          if [ "$(uname)" = "Darwin" ]; then
            nm "bin/${{ matrix.binary }}" 2>/dev/null | grep -i 'SherpaOnnx' >/dev/null               || { echo "::error::nightme-stt has no sherpa native symbols (macOS)"; exit 1; }
          else
            nm -D "bin/${{ matrix.binary }}" 2>/dev/null | grep -i 'SherpaOnnx' >/dev/null               || { echo "::error::nightme-stt has no sherpa native symbols"; exit 1; }
          fi
          echo "ok: nightme-stt links sherpa native symbols"

      # Stage binary + libs side-by-side so the rpath resolves
      # at run time. STAGE/lib/ matches the $ORIGIN/lib rpath
      # baked at link time.
      - name: Stage
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="dist/stage/${GOOS}-${GOARCH}-stt"
          mkdir -p "${STAGE}/lib"
          cp "bin/${{ matrix.binary }}" "${STAGE}/${{ matrix.binary }}"
          cp -R "${{ steps.loc.outputs.lib_dir }}/." "${STAGE}/lib/"
          cp LICENSE   "${STAGE}/LICENSE"
          cp README.md "${STAGE}/README.md"
          # Verify the libs are actually there. Failure here
          # means the cgo module dropped support for this arch
          # and we should drop the matrix leg.
          if [ -z "$(ls -A "${STAGE}/lib" | grep -E '\.(so|dylib|dll)$')" ]; then
            echo "::error::no shared libs copied for ${GOOS}/${GOARCH}"
            exit 1
          fi

      - name: Archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="dist/stage/${GOOS}-${GOARCH}-stt"
          case "$ARCHIVE" in
            tar.gz)
              tar -C "$STAGE" -czf                 "dist/nightme-stt_${VERSION}_${GOOS}_${GOARCH}.tar.gz"                 ${{ matrix.binary }} lib LICENSE README.md
              ;;
            zip)
              python3 -m zipfile -c                 "dist/nightme-stt_${VERSION}_${GOOS}_${GOARCH}.zip"                 "$STAGE/${{ matrix.binary }}"                 "$STAGE/lib"                 "$STAGE/LICENSE"                 "$STAGE/README.md"
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: nightme-stt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/nightme-stt_*.${{ matrix.archive }}
