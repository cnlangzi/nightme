name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 3-OS × 2-arch matrix. Each target builds on its own native
  # hosted runner because the release pipeline now depends on
  # platform-specific tooling that does not survive cross-compile
  # from a single Linux runner:
  #
  #   - macOS: trayTemplate.icns needs sips + iconutil (macOS-only
  #     Xcode CLT); systray uses Cocoa CGo
  #   - Windows: rsrc_windows_*.syso needs go-winres (Windows-only
  #     resource compiler); systray uses Win32 CGo
  #   - Linux: the -gui variant needs libgtk-3-dev +
  #     libayatana-appindicator3-dev (apt-only); CGo cross from
  #     non-Linux to Linux is fragile
  #
  # linux/arm64 runs on the native ubuntu-24.04-arm runner (free
  # and unlimited on public repos) rather than cross-compiling from
  # ubuntu-latest. Two reasons:
  #
  #   1. The -gui variant is CGo and needs arm64 GTK3 dev packages;
  #      cross-linking those from an amd64 host would need a full
  #      aarch64 sysroot.
  #   2. It fixes a latent mislabelling bug — this step used to run
  #      `make build` on an amd64 runner with no GOOS/GOARCH set,
  #      so the artifact published as linux_arm64 was in fact an
  #      amd64 binary. A native runner makes the arch correct by
  #      construction; the explicit GOOS/GOARCH below is a belt-and-
  #      braces guard against the matrix drifting back.
  #
  # Cost: 6 native runner-minutes per release instead of 1 ubuntu
  # runner doing 6 cross-compile. Acceptable because release runs
  # only on tag push (low frequency) and a broken release is more
  # expensive than the runner budget.
  #
  # Linux ships TWO archives per arch (see the Build step):
  #
  #   nightme_<v>_linux_<arch>.tar.gz       default — CGO_ENABLED=0,
  #                                         no tray, fully static,
  #                                         runs on any glibc/musl box
  #   nightme_<v>_linux_<arch>-gui.tar.gz   -tags gui — tray icon,
  #                                         needs libgtk-3-0 +
  #                                         libayatana-appindicator3-1
  #
  # The default archive keeps its existing name so install.sh needs
  # no change and existing users are unaffected. This split is the
  # fix for #295: the old single Linux binary always linked
  # libayatana-appindicator3.so.1, so it would not exec at all on a
  # server without the GTK3 runtime.
  #
  # macOS .app bundle: not shipped in the release. Users running
  # macOS as a daemon host build it locally via
  #   make build && make app-bundle && cp -R dist/NightMe.app /Applications/
  # The bare `nightme` binary in the tar.gz is the right payload
  # for `brew install` / `npm install -g` style packaging; .app is
  # a GUI-only convenience that does not need to be in the archive.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux + darwin: tar.gz convention
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
            archive: tar.gz
            binary: nightme
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
            binary: nightme
          - goos: darwin
            goarch: amd64
            os: macos-latest
            archive: tar.gz
            binary: nightme
          - goos: darwin
            goarch: arm64
            os: macos-latest
            archive: tar.gz
            binary: nightme
          # windows: zip convention (users expect .zip for .exe)
          - goos: windows
            goarch: amd64
            os: windows-latest
            archive: zip
            binary: nightme.exe
          - goos: windows
            goarch: arm64
            os: windows-latest
            archive: zip
            binary: nightme.exe
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # GTK3 + AppIndicator dev headers for the -gui variant's CGo
      # dependency. The DEFAULT Linux binary does not need these
      # (it is built CGO_ENABLED=0 with the tray compiled out), but
      # the same runner builds both, so we install unconditionally
      # for linux.
      #
      # Condition is on matrix.goos, NOT matrix.os: linux/arm64
      # runs on ubuntu-24.04-arm, so an `== 'ubuntu-latest'` test
      # would silently skip the install there and fail the -gui
      # link step.
      - name: Install systray build deps (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      # Delegate to the canonical build entry points so the release
      # binary is byte-for-byte what `make build` / `build.bat`
      # produces locally:
      #   - LDFLAGS: VERSION, GIT_COMMIT, BUILD_DATE baked in via
      #     the Makefile (and the matching section in build.bat)
      #   - Windows: go-winres injects logo.ico + manifest.xml as
      #     cmd/nightme/rsrc_windows_*.syso (auto-linked)
      #   - macOS: tray-assets generates trayTemplate.icns, and
      #     app-bundle wraps bin/nightme into dist/NightMe.app
      #   - Linux: tray-assets generates tray.png
      # A bare `go build` here would silently drop every embed step
      # and the release binary would have no icon, no manifest, and
      # no version metadata — three independent regressions in one
      # missing line. shell: bash so the same script works on all
      # three runners (Git Bash is preinstalled on windows-latest).
      #
      # GOOS/GOARCH are exported so the Makefile's host-tracking
      # defaults cannot silently produce a wrong-arch binary if the
      # matrix's runner label ever drifts away from the target arch.
      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ./build.bat
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            # macOS ships the .app bundle alongside the bare
            # binary so Finder-installed users get the proper
            # menu-bar icon without having to run `make
            # app-bundle` themselves.
            make build
            make app-bundle
          else
            # Linux builds TWO binaries (see the matrix comment):
            #
            #   bin/nightme     default. CGO_ENABLED=0 forces a
            #                   fully static executable — with the
            #                   tray compiled out, systray is the
            #                   only CGo dependency in the tree, so
            #                   this links no shared objects at all
            #                   and runs on any Linux host.
            #   bin/nightme-gui -tags gui. Dynamically links GTK3 +
            #                   AppIndicator for the tray icon.
            #
            # Order matters: build the static one FIRST. `make
            # build-gui` recurses into `make build` with an
            # overridden BIN_NAME, so running it second cannot
            # clobber bin/nightme.
            CGO_ENABLED=0 make build
            make build-gui

            # Fail the release rather than ship the #295 regression
            # again: the default artifact must not carry a GTK or
            # AppIndicator DT_NEEDED entry. `file` is used instead
            # of ldd for the static assertion because ldd exits
            # non-zero on a static binary.
            if ! file bin/nightme | grep -q "statically linked"; then
              echo "::error::bin/nightme is not statically linked — CGO_ENABLED=0 did not take effect"
              file bin/nightme
              exit 1
            fi
            if ldd bin/nightme 2>&1 | grep -qiE "ayatana|gtk-3"; then
              echo "::error::default Linux binary links GTK/AppIndicator (regression of #295)"
              ldd bin/nightme
              exit 1
            fi
          fi

      - name: Stage archive
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="dist/stage/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$STAGE"
          cp "bin/${{ matrix.binary }}" "$STAGE/${{ matrix.binary }}"
          cp LICENSE  "$STAGE/LICENSE"
          cp README.md "$STAGE/README.md"
          # macOS: also stage the .app bundle so the tar.gz
          # archive carries it. The dedicated .app-only zip is
          # produced by the Archive step below.
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ -d "dist/NightMe.app" ]; then
              cp -R "dist/NightMe.app" "$STAGE/NightMe.app"
            else
              echo "::error::dist/NightMe.app missing after 'make app-bundle' (build step did not run app-bundle?)"
              exit 1
            fi
          fi
          # Linux: stage the tray-enabled variant into its own
          # directory. The binary is renamed back to plain
          # `nightme` so a user who wants the tray can extract the
          # -gui archive straight over an existing install without
          # renaming anything or fixing up their PATH.
          if [ "${{ matrix.goos }}" = "linux" ]; then
            if [ ! -f "bin/nightme-gui" ]; then
              echo "::error::bin/nightme-gui missing after 'make build-gui'"
              exit 1
            fi
            GUI_STAGE="dist/stage/${{ matrix.goos }}-${{ matrix.goarch }}-gui"
            mkdir -p "$GUI_STAGE"
            cp bin/nightme-gui "$GUI_STAGE/nightme"
            cp LICENSE   "$GUI_STAGE/LICENSE"
            cp README.md "$GUI_STAGE/README.md"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE="dist/stage/${GOOS}-${GOARCH}"
          case "$ARCHIVE" in
            tar.gz)
              # macOS: include the .app bundle alongside the
              # bare binary. Linux: just the binary.
              if [ "${GOOS}" = "darwin" ]; then
                tar -C "$STAGE" -czf \
                  "dist/nightme_${VERSION}_${GOOS}_${GOARCH}.tar.gz" \
                  ${{ matrix.binary }} NightMe.app LICENSE README.md
              else
                tar -C "$STAGE" -czf \
                  "dist/nightme_${VERSION}_${GOOS}_${GOARCH}.tar.gz" \
                  ${{ matrix.binary }} LICENSE README.md
              fi
              # Linux-only: the tray-enabled companion archive.
              # Same layout and same inner binary name as the
              # default archive; only the tarball name differs, so
              # install.sh keeps resolving the default (tray-less)
              # asset with no change and users opt in to the tray
              # by downloading the -gui archive explicitly.
              if [ "${GOOS}" = "linux" ]; then
                tar -C "dist/stage/${GOOS}-${GOARCH}-gui" -czf \
                  "dist/nightme_${VERSION}_${GOOS}_${GOARCH}-gui.tar.gz" \
                  nightme LICENSE README.md
              fi
              # macOS-only: a separate .app-only zip for
              # Finder-native install. macOS users typically
              # double-click the .zip in Safari → drag the
              # extracted .app to /Applications. The
              # tar.gz's embedded NightMe.app also works
              # but requires the user to know to extract
              # the .app; .zip is the discoverable path.
              if [ "${GOOS}" = "darwin" ]; then
                python3 -m zipfile -c \
                  "dist/nightme_${VERSION}_${GOOS}_${GOARCH}-app.zip" \
                  "$STAGE/NightMe.app"
              fi
              ;;
            zip)
              # python3 is preinstalled on the three hosted runners
              # (Windows ships it as both `python` and `python3`).
              # Using it avoids needing the `zip` apt package on
              # Linux and PowerShell Compress-Archive on Windows.
              python3 -m zipfile -c \
                "dist/nightme_${VERSION}_${GOOS}_${GOARCH}.zip" \
                "$STAGE/${{ matrix.binary }}" \
                "$STAGE/LICENSE" \
                "$STAGE/README.md"
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: nightme-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/nightme_*.${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload .app bundle (macOS only)
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v6
        with:
          name: nightme-${{ matrix.goos }}-${{ matrix.goarch }}-app
          path: dist/nightme_*-app.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # sha256sum is content-addressed, so it handles both
          # .tar.gz and .zip files in the same pass.
          sha256sum nightme_*.tar.gz nightme_*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
