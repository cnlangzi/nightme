# nightme example configuration
# Copy to ~/.config/nightme/config.yaml and edit.

feishu:
  # App credentials from https://open.feishu.cn/app
  app_id: "cli_xxxxxxxxxxxxxxxx"
  app_secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # Optional — leave blank if your app is not event-subscribed via HTTP.
  verification_token: ""
  encrypt_key: ""

agents:
  # Global default agent name (v1.2). Must match one of the recipe
  # names below. Used when a new ChatSession is created (snapshot
  # into ChatSession.defaultAgent) and as the fallback during
  # LookupActiveAgentSession (Q-B).
  default: "claude"

  # Per-agent spawn recipes. Each top-level key under `agents:`
  # (other than `default`) is a recipe; names must match the
  # registered agent's Name() (e.g. "claude", "codex", "opencode").
  claude:
    command: "claude"
    args: []
    env: {}

  codex:
    # Codex ships ACP through the official adapter binary.
    command: "codex-acp"
    args: []
    env: {}

  opencode:
    command: "opencode"
    args: ["acp"]
    env: {}

session:
  # Initial PTY size for new sessions.
  default_pty_cols: 80
  default_pty_rows: 24

  # Aggregator tunables.
  output_chunk_size: 4096        # bytes
  output_flush_interval_ms: 200  # milliseconds

logging:
  # One of debug, info, warn, error (case-insensitive).
  level: "info"
  # Empty -> stdout. Set to a path for file logging.
  file: ""

paths:
  # Root for registry.json, sessions.json, per-session scratch.
  data_dir: "~/.local/share/nightme"
  registry_file: "registry.json"
  sessions_file: "sessions.json"
