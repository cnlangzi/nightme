# nightme example configuration
# Copy to ~/.nightme/config.yaml and edit.

# Optional human-readable name for this nightme instance. Used to
# tell apart multiple machines running the daemon (in logs / IM
# message headers / gateway registrations, once those start using
# it). Leave blank to fall back to os.Hostname() at runtime — the
# fallback is NOT persisted to this file. Set via `nightme config`
# → Name. To clear, delete this line and re-run any command that
# rewrites config.yaml (or just edit the file).
# name: macbook-pro

# Primary (default) agent name. Used when no /use <name> is given.
primary: claude

# Let the agent CLIs nightme spawns send their own client telemetry
# (usage analytics, error reporting). Off by default: every bridge
# disables its CLI's telemetry for the child it spawns, and the CLI
# you run by hand keeps its own defaults. Set to true to opt out of
# that policy. The NIGHTME_AGENT_TELEMETRY environment variable
# overrides this key.
agent_telemetry: false

# Custom agents. Each entry can either extend a built-in (same name
# replaces the built-in) or add a brand-new agent. Bridge is the
# Bridge backend type (claude / codex / opencode / pi); Command is
# the full command line including any flags. The Pi entry assumes
# the @earendil-works/pi-coding-agent CLI is on PATH (install with
# `npm install -g @earendil-works/pi-coding-agent`); the F-32 bridge
# is registered as a builtin, so the structured RPC events are
# available whether you set `pi` here or use the builtin default.
agents:
  - name: claude
    bridge: claude
    command: "claude --dangerously-skip-permissions"

  - name: codex
    bridge: codex
    command: codex
    # bridge automatically spawns `codex app-server --listen stdio://`
    # and drives it via JSON-RPC 2.0 over raw stdio pipes (no PTY).
    # See docs/bridge/codex.md.

  - name: opencode
    bridge: opencode
    command: opencode
    # Bridge spawns `opencode serve --hostname=127.0.0.1 --port=0`
    # (the server picks a free port and prints the bound URL on
    # stdout), then drives the 9 OpenAPI endpoints via plain HTTP +
    # SSE. No PTY, no JSON-RPC envelope. See
    # docs/feat/F-OPENCODE-opencode-bridge.md.

  - name: pi
    bridge: pi
    command: "pi"

feishu:
  # App credentials from https://open.feishu.cn/app
  app_id: "cli_xxxxxxxxxxxxxxxx"
  app_secret: "xxxxxx…xxxx"
  # Optional — leave blank if your app is not event-subscribed via HTTP.
  verification_token: ""
  encrypt_key: ""

telegram:
  # Create a bot with @BotFather and use its token here.
  bot_token: ""
  # Long polling only — webhook mode is not supported.
  polling_timeout: 30
  # Group mention gate is controlled per-chat via /watch all|mention|off,
  # not by config. Default is mention-only on first contact.

slack:
  # Bot User OAuth Token from "Install App" (xoxb-...).
  bot_token: ""
  # App-Level Token with the connections:write scope, generated in the
  # Socket Mode settings page (xapp-...). Socket Mode only — the Events
  # API / public-URL path is not supported, so no signing secret.
  app_token: ""
  # Minimum interval between chat.appendStream calls for one turn.
  # Slack's Tier 4 would allow ~600ms; 3s is deliberate headroom.
  stream_throttle_ms: 3000

session:
  # Initial PTY size for new sessions.
  default_pty_cols: 80
  default_pty_rows: 24

  # Aggregator tunables.
  output_chunk_size: 4096        # bytes
  output_flush_interval_ms: 200  # milliseconds

logging:
  # One of debug, info, warn, error (case-insensitive).
  level: "info"
  # Empty -> stdout. Set to a path for file logging.
  file: ""

paths:
  # Root for the v1.2 persistence stores (chat_sessions.json +
  # agent_sessions.json) and per-session scratch.
  data_dir: "~/.nightme"

# The personal agent — /me start <workflow>. Both halves are
# optional: with only `llm` it runs its tool loop, with only
# `decider` it runs its fast path and asks you for everything it is
# not sure about, and with both the fast path hands the uncertain
# steps to the tool loop. The API key comes from `api_key`, which
# holds it in this file, or from `api_key_env`, which names the
# environment variable that holds it — set one of the two, not both:
# `api_key` wins when both are set, and a model with neither needs
# no authentication.
#
# The decider's base is the root of the API; the version segment is
# added when the base does not carry it. The protocols live at
# {base}/v1/decisions and {base}/v1/systemone.
me:
  # llm:
  #   provider: openai
  #   base_url: https://api.openai.com/v1
  #   model: gpt-4.1-mini
  #   api_key: sk-xxxx
  #   max_tokens: 4096
  # decider:
  #   protocol: decisions
  #   base_url: https://openrouter.ai/api/v1
  #   model: typesafe/jev-1.14
  #   api_key_env: OPENROUTER_API_KEY
  #   min_confidence: 0.8
  # For protocol: systemone the base is https://api.typesafe.ai and the
  # model is jev-latest.
